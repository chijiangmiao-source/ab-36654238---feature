name: calibsvc

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: calib
      POSTGRES_PASSWORD: calib
      POSTGRES_DB: calib
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calib -d calib"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgres://calib:calib@db:5432/calib?sslmode=disable
      PORT: "8080"
    ports:
      # Host-side port is configurable: HOST_PORT=9090 docker compose up
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-8080}/health >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # One-shot acceptance harness: runs build checks, unit tests and HTTP smoke
  # scenarios, then exits 0 (pass) or 1 (fail). It only starts once the app
  # is healthy, i.e. able to serve publishes.
  verify:
    build:
      context: .
      target: verify
    environment:
      APP_URL: http://app:8080
      DATABASE_URL: postgres://calib:calib@db:5432/calib?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: "no"
